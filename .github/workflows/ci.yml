name: check and build site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build, cross-check, print axioms, benchmark
        run: ./check.sh 1000000
      - name: C program against the static library
        run: ./ffi/build.sh 1000000
      - name: Build the site
        working-directory: site
        run: |
          lake build subverso-extract-mod
          lake build
          lake exe just-lean-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_out/html-multi

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
